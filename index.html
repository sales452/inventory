<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse inventory</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f5f4f0; color: #1a1a1a; max-width: 480px; margin: 0 auto;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 4px 0 12px; }
  .hint { font-size: 12px; color: #888; margin-bottom: 12px; }
  input, select, button {
    font-size: 15px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #d8d6cf; width: 100%; background: #fff;
  }
  button { background: #1a1a1a; color: #fff; border: none; cursor: pointer; font-weight: 500; }
  button.secondary { background: #fff; color: #1a1a1a; border: 1px solid #d8d6cf; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  #addBox { display: none; flex-direction: column; gap: 8px; background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid #e5e3db; }
  .count { font-size: 12px; color: #666; margin: 8px 0; }
  .item { border: 1px solid #e5e3db; border-radius: 10px; padding: 12px; margin-bottom: 8px; background: #fff; }
  .item.zero { background: #FFF9B0; border-color: #E8D93A; }
  .item .name { font-family: ui-monospace, monospace; font-size: 14px; word-break: break-word; }
  .item .meta { font-size: 12px; color: #888; margin: 4px 0 8px; }
  .qtyrow { display: flex; align-items: center; gap: 10px; }
  .qtybtn { width: 44px; height: 44px; padding: 0; border-radius: 8px; font-size: 18px; }
  .qtyval { flex: 1; text-align: center; font-size: 15px; }
  .empty { color: #888; font-size: 13px; padding: 12px 0; text-align: center; }
  .status { font-size: 12px; color: #b8531c; margin-bottom: 8px; min-height: 16px; }
  .status.ok { color: #2f7d4f; }
</style>
</head>
<body>

<h1>Warehouse inventory</h1>
<div class="hint">Searches NEW CORE STOCK LIST, office warehouse, warehouse, Kolkata, and Bangalore Office</div>

<script>
  // Apps Script web app URL -- only used now for mutations (add / sheet mirroring),
  // not for search. Search reads straight from Firebase.
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdLgK9kx778Fu1_O0yrGR2tyJJhDzK8nxAheqdeczLUvDt9pW90QelZqcJxKwnhQzZ/exec";

  const firebaseConfig = {
    apiKey: "AIzaSyDgGzXOrJBGXnrzjPidDvoQWP9YYGLCUU0",
    authDomain: "inventory-6f4b7.firebaseapp.com",
    databaseURL: "https://inventory-6f4b7-default-rtdb.firebaseio.com",
    projectId: "inventory-6f4b7",
    storageBucket: "inventory-6f4b7.firebasestorage.app",
    messagingSenderId: "1023400247300",
    appId: "1:1023400247300:web:766141b3bafd89eb9b7551"
  };

  // Maps the Firebase node key back to the real sheet name used by Apps Script / SHEET_CONFIG.
  // "kolkata" and "bangalore_office" are pushed by their own separate Apps Script
  // projects (kolkata_sync.gs and bangalore_office_sync.gs), each bound to its own
  // spreadsheet under its own Google login -- this app never talks to those sheets
  // directly, it only reads what those scripts already pushed into Firebase.
  const SHEET_NAMES = {
    "NEW_CORE_STOCK_LIST": "NEW CORE STOCK LIST",
    "office_warehouse": "office warehouse",
    "warehouse": "warehouse",
    "kolkata": "Kolkata",
    "bangalore_office": "Bangalore Office"
  };
</script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<div id="status" class="status"></div>

<input id="q" placeholder="Search item or part number" />
<div style="height:8px"></div>
<button onclick="showAdd()">+ Add item</button>

<div id="addBox">
  <input id="aName" placeholder="Item / part number" />
  <select id="aWh">
    <option>NEW CORE STOCK LIST</option>
    <option>office warehouse</option>
    <option>warehouse</option>
  </select>
  <div class="row">
    <input id="aRack" placeholder="Rack (e.g. A, or RACK NO.1)" style="flex:2" />
    <input id="aQty" placeholder="Qty" type="number" style="flex:1" />
  </div>
  <button onclick="addItem()">Save</button>
  <button class="secondary" onclick="hideAdd()">Cancel</button>
</div>

<div class="count" id="count"></div>
<div id="results"></div>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Flat in-memory copy of everything, rebuilt whenever Firebase pushes an update.
// This is what makes search instant -- no network round trip per keystroke.
let allItems = [];

function setStatus(msg, ok) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.classList.toggle('ok', !!ok);
}

setStatus('Loading…');
db.ref('inventory').on('value', (snap) => {
  const data = snap.val() || {};
  const flat = [];
  Object.keys(SHEET_NAMES).forEach((key) => {
    const node = data[key] || {};
    Object.keys(node).forEach((itemKey) => {
      const it = node[itemKey];
      flat.push({
        firebaseKey: key + '/' + itemKey,
        sheet: SHEET_NAMES[key],
        name: it.name,
        rack: it.rack,
        qty: Number(it.qty) || 0,
        row: it.row,
        col: it.col,
        qtyCol: it.qtyCol || null
      });
    });
  });
  allItems = flat;
  setStatus('Synced · ' + flat.length + ' items', true);
  search(); // re-render current search results with fresh data
}, (err) => {
  setStatus('Could not connect to Firebase: ' + err.message);
});

let timer = null;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(search, 120); // just a light debounce for typing, not a network wait
});

function showAdd() { document.getElementById('addBox').style.display = 'flex'; }
function hideAdd() { document.getElementById('addBox').style.display = 'none'; }

function search() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (!q) { document.getElementById('results').innerHTML = ''; document.getElementById('count').textContent = ''; return; }
  const items = allItems.filter(it => String(it.name).toLowerCase().indexOf(q) !== -1);
  render(items);
}

function render(items) {
  document.getElementById('count').textContent = items.length + (items.length === 1 ? ' item' : ' items');
  document.getElementById('results').innerHTML = items.map((it, i) => `
    <div class="item${Number(it.qty) === 0 ? ' zero' : ''}" id="item-${i}">
      <div class="name">${escapeHtml(it.name)}</div>
      <div class="meta">${escapeHtml(it.sheet)} &middot; Rack ${escapeHtml(it.rack)}</div>
      <div class="qtyrow">
        <button class="qtybtn secondary" onclick="changeQty(${i}, -1)">−</button>
        <div class="qtyval" id="qty-${i}">${it.qty}</div>
        <button class="qtybtn secondary" onclick="changeQty(${i}, 1)">+</button>
      </div>
    </div>
  `).join('') || `<div class="empty">No matches.</div>`;
  window.__rendered = items;
}

function changeQty(i, delta) {
  const it = window.__rendered[i];
  const max = it.qtyCol ? Infinity : 1;
  const newQty = Math.min(max, Math.max(0, (Number(it.qty) || 0) + delta));

  // 1. Update the screen immediately.
  document.getElementById(`qty-${i}`).textContent = newQty;
  document.getElementById(`item-${i}`).classList.toggle('zero', newQty === 0);
  it.qty = newQty;

  // 2. Write straight to Firebase -- this is the fast path, no waiting on Sheets.
  db.ref('inventory/' + it.firebaseKey + '/qty').set(newQty)
    .then(() => setStatus('Synced', true))
    .catch((err) => setStatus('Firebase save failed: ' + err.message));

  // 3. Mirror the change onto the actual Sheet cell in the background. The screen
  //    doesn't wait on this -- it's just keeping the Sheet itself up to date.
  //    NOTE: this only applies to sheets managed by APPS_SCRIPT_URL (NEW CORE STOCK
  //    LIST, office warehouse, warehouse). Kolkata and Bangalore Office are synced
  //    one-way (Sheet -> Firebase) by their own separate scripts, so +/- taps here
  //    update Firebase live but do NOT write back to those two source sheets.
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'updateQty', sheet: it.sheet, row: it.row, col: it.col, qtyCol: it.qtyCol, qty: newQty })
  }).catch(() => { /* Sheet mirror failed silently; the 15-min reconcile trigger will fix drift */ });
}

async function addItem() {
  const name = document.getElementById('aName').value.trim();
  const sheet = document.getElementById('aWh').value;
  const rack = document.getElementById('aRack').value.trim();
  const qty = parseInt(document.getElementById('aQty').value) || 0;
  if (!name || !rack) { setStatus('Enter an item name and rack.'); return; }

  // Adding goes through Apps Script (it needs to find/create the right row in the
  // right rack section) -- Apps Script then pushes the update to Firebase itself.
  setStatus('Saving…');
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'add', sheet, rack, name, qty })
    });
    const data = await res.json();
    if (data.error) { setStatus(data.error); return; }
    setStatus('Saved', true);
    hideAdd();
    document.getElementById('aName').value = '';
    document.getElementById('aRack').value = '';
    document.getElementById('aQty').value = '';
    document.getElementById('q').value = name;
    search();
  } catch (err) {
    setStatus('Save failed. Try again.');
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
